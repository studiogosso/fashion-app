<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a16">
<title>ファッション史 - Fashion History</title>
<link rel="manifest" href="data:application/json;base64,eyJuYW1lIjoi44OV44Kh44OD44K344On44Oz5Y+yIiwiYmFja2dyb3VuZF9jb2xvciI6IiMwYTBhMTYiLCJ0aGVtZV9jb2xvciI6IiNlODQzOTMiLCJkaXNwbGF5Ijoic3RhbmRhbG9uZSIsInN0YXJ0X3VybCI6Ii4ifQ==">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--bg:#0a0a16;--bg2:rgba(17,17,40,.7);--bg3:rgba(26,26,62,.6);--bg4:rgba(34,34,85,.5);
--glass:rgba(255,255,255,.04);--glass-border:rgba(255,255,255,.08);--glass-hover:rgba(255,255,255,.08);
--accent:#e84393;--accent2:#fd79a8;--accent3:#fab1d0;
--gold:#f9ca24;--silver:#dfe6e9;--text:#eee;--text2:#aaa;--text3:#777;
--radius:16px;--shadow:0 8px 32px rgba(0,0,0,.4);
--blur:blur(16px);
}
html,body{background:var(--bg);color:var(--text);font-family:'Segoe UI','Hiragino Sans',sans-serif;overflow-x:hidden;min-height:100vh;min-height:100dvh;-webkit-tap-highlight-color:transparent}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 20%,rgba(232,67,147,.06) 0%,transparent 50%),radial-gradient(ellipse at 80% 80%,rgba(249,202,36,.04) 0%,transparent 50%);pointer-events:none;z-index:0}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--accent);border-radius:4px}

/* -- Header -- */
.app-header{position:sticky;top:0;z-index:100;background:rgba(10,10,22,.8);border-bottom:1px solid var(--glass-border);padding:12px 16px;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.app-title{font-size:1.3rem;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:.5px}
.app-subtitle{font-size:.7rem;color:var(--text3);margin-top:2px;letter-spacing:1px}

/* -- Navigation -- */
.nav-bar{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;background:rgba(10,10,22,.6);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);position:sticky;top:52px;z-index:99;-ms-overflow-style:none;scrollbar-width:none}
.nav-bar::-webkit-scrollbar{display:none}
.nav-btn{flex-shrink:0;padding:8px 16px;border-radius:20px;border:1px solid var(--glass-border);background:var(--glass);color:var(--text2);font-size:.78rem;cursor:pointer;transition:all .25s;white-space:nowrap;font-weight:600;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.nav-btn.active{background:linear-gradient(135deg,var(--accent),#d63384);color:#fff;border-color:var(--accent);box-shadow:0 2px 16px rgba(232,67,147,.35)}
.nav-btn:hover:not(.active){border-color:rgba(232,67,147,.4);background:var(--glass-hover)}

/* -- Section common -- */
.section{display:none;padding:16px;padding-bottom:120px;animation:fadeUp .35s ease;position:relative;z-index:1}
.section.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.section-title{font-size:1.15rem;font-weight:700;margin-bottom:16px;padding-left:12px;border-left:3px solid var(--accent);color:var(--accent2)}

/* -- Timeline -- */
.timeline-scroll{overflow-x:auto;padding-bottom:16px;-ms-overflow-style:none;scrollbar-width:none}
.timeline-scroll::-webkit-scrollbar{display:none}
.timeline-track{display:flex;gap:16px;padding:8px 4px;min-width:max-content;position:relative}
.timeline-track::before{content:'';position:absolute;top:50%;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),var(--gold),var(--accent),transparent);transform:translateY(-50%);z-index:0}
.era-card{position:relative;z-index:1;width:280px;flex-shrink:0;background:rgba(17,17,40,.6);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-border);border-radius:var(--radius);padding:20px;cursor:pointer;transition:all .3s}
.era-card:hover,.era-card.expanded{border-color:rgba(232,67,147,.4);box-shadow:0 0 30px rgba(232,67,147,.15);transform:translateY(-4px)}
.era-card.expanded{background:rgba(17,17,40,.85)}
.era-years{font-size:.7rem;color:var(--accent);font-weight:700;letter-spacing:2px;margin-bottom:6px}
.era-title{font-size:1rem;font-weight:700;margin-bottom:8px;line-height:1.4}
.era-expand-hint{font-size:.65rem;color:var(--text3);margin-top:8px;transition:opacity .2s}
.era-card.expanded .era-expand-hint{opacity:0;height:0;margin:0;overflow:hidden}
.era-desc{font-size:.8rem;color:var(--text2);line-height:1.6}
.era-designers{margin-top:10px;display:flex;flex-wrap:wrap;gap:4px}
.era-tag{font-size:.65rem;padding:3px 8px;border-radius:10px;background:rgba(232,67,147,.12);color:var(--accent2);border:1px solid rgba(232,67,147,.15)}
.era-detail{display:none;margin-top:14px;padding-top:14px;border-top:1px solid rgba(232,67,147,.12);font-size:.8rem;color:var(--text2);line-height:1.7}
.era-card.expanded .era-detail{display:block;animation:fadeUp .3s ease}

/* -- Brand Cards -- */
.brand-search-wrap{margin-bottom:12px}
.brand-search{width:100%;padding:12px 16px;border-radius:var(--radius);border:1px solid var(--glass-border);background:rgba(17,17,40,.5);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);color:var(--text);font-size:.85rem;outline:none;transition:border-color .25s}
.brand-search:focus{border-color:var(--accent)}
.brand-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.brand-card{background:rgba(17,17,40,.5);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-border);border-radius:var(--radius);padding:16px;cursor:pointer;transition:all .3s;position:relative;overflow:hidden}
.brand-card:hover{border-color:rgba(232,67,147,.4);transform:translateY(-3px);box-shadow:var(--shadow)}
.brand-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--gold))}
.brand-name{font-size:.9rem;font-weight:700;margin-bottom:4px}
.brand-year{font-size:.7rem;color:var(--accent);font-weight:600}
.brand-founder{font-size:.72rem;color:var(--text3);margin-top:4px}
.brand-country{font-size:.65rem;color:var(--text3);margin-top:2px}

/* -- Brand Detail Modal -- */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.modal-overlay.show{display:flex}
.modal-content{background:rgba(17,17,40,.9);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(232,67,147,.2);border-radius:var(--radius);max-width:500px;width:100%;max-height:85vh;overflow-y:auto;padding:24px;position:relative;animation:fadeUp .3s ease}
.modal-close{position:absolute;top:12px;right:16px;background:none;border:none;color:var(--text3);font-size:1.4rem;cursor:pointer;z-index:10;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:all .2s}
.modal-close:hover{color:var(--accent);background:rgba(232,67,147,.1)}
.modal-brand-name{font-size:1.4rem;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px;padding-right:40px}
.modal-brand-sub{font-size:.8rem;color:var(--text3);margin-bottom:16px}
.modal-section{margin-bottom:16px}
.modal-section h4{font-size:.82rem;color:var(--accent2);margin-bottom:8px;font-weight:700}
.modal-section p,.modal-section li{font-size:.8rem;color:var(--text2);line-height:1.7}
.modal-section ul{padding-left:18px}
.modal-section li{margin-bottom:4px}
.modal-tag{display:inline-block;font-size:.65rem;padding:3px 8px;border-radius:10px;background:rgba(232,67,147,.1);color:var(--accent2);margin:2px 4px 2px 0;border:1px solid rgba(232,67,147,.12)}
.bookmark-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:20px;border:1px solid rgba(232,67,147,.25);background:var(--glass);color:var(--accent2);font-size:.78rem;cursor:pointer;transition:all .25s;margin-top:8px}
.bookmark-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.bookmark-btn:hover:not(.active){border-color:var(--accent);background:rgba(232,67,147,.1)}

/* -- Collections -- */
.collection-list{display:flex;flex-direction:column;gap:12px}
.collection-card{background:rgba(17,17,40,.5);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-border);border-radius:var(--radius);padding:18px;transition:all .3s;cursor:pointer}
.collection-card:hover{border-color:rgba(232,67,147,.4);box-shadow:0 0 20px rgba(232,67,147,.1)}
.collection-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;gap:8px}
.collection-name{font-size:.95rem;font-weight:700;flex:1}
.collection-year{font-size:.72rem;color:var(--gold);font-weight:700;background:rgba(249,202,36,.08);padding:3px 10px;border-radius:10px;flex-shrink:0}
.collection-designer{font-size:.78rem;color:var(--accent2);margin-bottom:6px}
.collection-desc{font-size:.78rem;color:var(--text2);line-height:1.6}
.collection-impact{margin-top:10px;font-size:.72rem;color:var(--text3);font-style:italic;padding-left:10px;border-left:2px solid rgba(232,67,147,.3)}

/* -- Quiz -- */
.quiz-area{max-width:500px;margin:0 auto}
.quiz-score{text-align:center;margin-bottom:20px;padding:16px;background:rgba(17,17,40,.5);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-radius:var(--radius);border:1px solid var(--glass-border)}
.quiz-score-num{font-size:2rem;font-weight:800;color:var(--accent)}
.quiz-score-label{font-size:.75rem;color:var(--text3)}
.quiz-score-pct{font-size:.8rem;color:var(--gold);margin-top:4px;font-weight:600}
.quiz-reset-btn{margin-top:8px;padding:6px 14px;border-radius:12px;border:1px solid var(--glass-border);background:var(--glass);color:var(--text3);font-size:.7rem;cursor:pointer;transition:all .25s}
.quiz-reset-btn:hover{border-color:var(--accent);color:var(--accent2)}
.quiz-card{background:rgba(17,17,40,.5);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-border);border-radius:var(--radius);padding:24px;margin-bottom:16px}
.quiz-question{font-size:1rem;font-weight:700;margin-bottom:16px;line-height:1.5}
.quiz-options{display:flex;flex-direction:column;gap:8px}
.quiz-opt{padding:12px 16px;border-radius:12px;border:1px solid var(--glass-border);background:rgba(10,10,22,.5);color:var(--text);font-size:.85rem;cursor:pointer;transition:all .25s;text-align:left}
.quiz-opt:hover:not(.disabled){border-color:rgba(232,67,147,.4);background:rgba(232,67,147,.06)}
.quiz-opt.correct{border-color:#00b894;background:rgba(0,184,148,.12);color:#55efc4}
.quiz-opt.wrong{border-color:#d63031;background:rgba(214,48,49,.12);color:#ff7675}
.quiz-opt.disabled{pointer-events:none}
.quiz-explanation{display:none;margin-top:12px;padding:12px;border-radius:12px;background:rgba(249,202,36,.06);border:1px solid rgba(249,202,36,.12);font-size:.78rem;color:var(--text2);line-height:1.6}
.quiz-explanation.show{display:block;animation:fadeUp .3s ease}
.quiz-next{display:none;margin-top:16px;padding:12px 24px;border-radius:20px;border:none;background:linear-gradient(135deg,var(--accent),#d63384);color:#fff;font-size:.85rem;font-weight:700;cursor:pointer;width:100%;transition:transform .2s}
.quiz-next:hover{transform:scale(1.02)}
.quiz-next.show{display:block}
.quiz-category-btns{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;justify-content:center}
.quiz-cat-btn{padding:8px 14px;border-radius:16px;border:1px solid var(--glass-border);background:var(--glass);color:var(--text2);font-size:.75rem;cursor:pointer;transition:all .25s}
.quiz-cat-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.quiz-cat-btn:hover:not(.active){border-color:rgba(232,67,147,.4)}

/* -- Glossary -- */
.glossary-search{width:100%;padding:12px 16px;border-radius:var(--radius);border:1px solid var(--glass-border);background:rgba(17,17,40,.5);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);color:var(--text);font-size:.85rem;margin-bottom:16px;outline:none;transition:border-color .25s}
.glossary-search:focus{border-color:var(--accent)}
.glossary-count{font-size:.72rem;color:var(--text3);margin-bottom:12px;text-align:right}
.glossary-list{display:flex;flex-direction:column;gap:8px}
.glossary-item{background:rgba(17,17,40,.4);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--glass-border);border-radius:12px;padding:14px 16px;cursor:pointer;transition:all .25s}
.glossary-item:hover{border-color:rgba(232,67,147,.3)}
.glossary-item.open{border-color:rgba(232,67,147,.3);background:rgba(17,17,40,.6)}
.glossary-term{font-size:.9rem;font-weight:700;color:var(--accent2);margin-bottom:2px}
.glossary-term-en{font-size:.72rem;color:var(--text3);margin-bottom:6px}
.glossary-def{font-size:.78rem;color:var(--text2);line-height:1.6;display:none}
.glossary-item.open .glossary-def{display:block;animation:fadeUp .25s ease}

/* -- Connections -- */
.connections-container{position:relative}
.connection-group{margin-bottom:16px;background:rgba(17,17,40,.5);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-border);border-radius:var(--radius);padding:16px;transition:border-color .25s}
.connection-group:hover{border-color:rgba(232,67,147,.3)}
.connection-title{font-size:.9rem;font-weight:700;color:var(--accent2);margin-bottom:10px}
.connection-flow{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.connection-node{padding:6px 12px;border-radius:10px;background:rgba(232,67,147,.08);border:1px solid rgba(232,67,147,.15);font-size:.75rem;color:var(--text);font-weight:600;transition:all .2s}
.connection-node:hover{background:rgba(232,67,147,.15);border-color:rgba(232,67,147,.3)}
.connection-arrow{color:var(--accent);font-size:.85rem}
.connection-desc{font-size:.75rem;color:var(--text3);margin-top:10px;line-height:1.6;padding-top:10px;border-top:1px solid rgba(255,255,255,.04)}

/* -- Bookmarks -- */
.bookmark-list{display:flex;flex-direction:column;gap:10px}
.bookmark-item{display:flex;align-items:center;justify-content:space-between;background:rgba(17,17,40,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--glass-border);border-radius:12px;padding:14px 16px;cursor:pointer;transition:all .25s}
.bookmark-item:hover{border-color:rgba(232,67,147,.3)}
.bookmark-info{flex:1}
.bookmark-type{font-size:.65rem;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:1px}
.bookmark-name{font-size:.85rem;font-weight:600;margin-top:2px}
.bookmark-remove{background:none;border:none;color:var(--text3);font-size:1.1rem;cursor:pointer;padding:4px 8px;border-radius:50%;transition:all .2s;width:32px;height:32px;display:flex;align-items:center;justify-content:center}
.bookmark-remove:hover{color:#d63031;background:rgba(214,48,49,.1)}
.empty-state{text-align:center;padding:40px 20px;color:var(--text3);font-size:.85rem}
.empty-state-icon{font-size:2.5rem;margin-bottom:12px;opacity:.4}

/* -- Filter/sort bar -- */
.filter-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filter-select{padding:8px 12px;border-radius:12px;border:1px solid var(--glass-border);background:rgba(17,17,40,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--text);font-size:.78rem;outline:none;cursor:pointer;transition:border-color .25s}
.filter-select:focus{border-color:var(--accent)}
.filter-select option{background:#111128;color:var(--text)}

/* -- Stats bar -- */
.stats-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.stat-chip{padding:6px 12px;border-radius:10px;background:var(--glass);border:1px solid var(--glass-border);font-size:.7rem;color:var(--text2)}
.stat-chip strong{color:var(--accent2);margin-right:4px}

/* -- Back to top -- */
.back-to-top{position:fixed;bottom:24px;right:24px;width:44px;height:44px;border-radius:50%;background:rgba(232,67,147,.8);border:1px solid rgba(232,67,147,.4);color:#fff;font-size:1.2rem;cursor:pointer;display:none;align-items:center;justify-content:center;z-index:150;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:all .3s;box-shadow:0 4px 16px rgba(232,67,147,.3)}
.back-to-top.show{display:flex}
.back-to-top:hover{transform:scale(1.1);background:var(--accent)}

/* -- Responsive -- */
@media(max-width:480px){
  .brand-grid{grid-template-columns:repeat(2,1fr);gap:8px}
  .era-card{width:250px;padding:16px}
  .modal-content{padding:18px;margin:8px}
  .filter-bar{gap:6px}
  .filter-select{font-size:.75rem;padding:7px 10px}
  .stats-bar{gap:6px}
  .stat-chip{font-size:.65rem;padding:5px 10px}
  .back-to-top{bottom:16px;right:16px;width:40px;height:40px}
}
@media(max-width:360px){
  .brand-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header class="app-header">
  <div class="app-title">ファッション史</div>
  <div class="app-subtitle">FASHION HISTORY ENCYCLOPEDIA</div>
</header>

<nav class="nav-bar" id="navBar">
  <button class="nav-btn active" data-section="timeline">タイムライン</button>
  <button class="nav-btn" data-section="brands">ブランド</button>
  <button class="nav-btn" data-section="collections">コレクション</button>
  <button class="nav-btn" data-section="quiz">クイズ</button>
  <button class="nav-btn" data-section="glossary">用語集</button>
  <button class="nav-btn" data-section="connections">系譜</button>
  <button class="nav-btn" data-section="bookmarks">ブックマーク</button>
</nav>

<main>
  <!-- Timeline -->
  <div class="section active" id="sec-timeline">
    <h2 class="section-title">ファッション史タイムライン</h2>
    <div class="stats-bar">
      <div class="stat-chip"><strong>10</strong>時代</div>
      <div class="stat-chip"><strong>170+</strong>年の歴史</div>
    </div>
    <div class="timeline-scroll">
      <div class="timeline-track" id="timelineTrack"></div>
    </div>
  </div>

  <!-- Brands -->
  <div class="section" id="sec-brands">
    <h2 class="section-title">ブランドプロフィール</h2>
    <div class="brand-search-wrap">
      <input class="brand-search" id="brandSearch" placeholder="ブランド名・創設者で検索...">
    </div>
    <div class="filter-bar">
      <select class="filter-select" id="brandSort">
        <option value="alpha">A-Z</option>
        <option value="year">設立年順</option>
        <option value="country">国別</option>
      </select>
      <select class="filter-select" id="brandCountry">
        <option value="all">全ての国</option>
        <option value="France">フランス</option>
        <option value="Italy">イタリア</option>
        <option value="UK">イギリス</option>
        <option value="Japan">日本</option>
        <option value="USA">アメリカ</option>
      </select>
      <div class="stat-chip" id="brandCount"><strong>0</strong>ブランド</div>
    </div>
    <div class="brand-grid" id="brandGrid"></div>
  </div>

  <!-- Collections -->
  <div class="section" id="sec-collections">
    <h2 class="section-title">伝説のコレクション</h2>
    <div class="filter-bar">
      <select class="filter-select" id="collectionEra">
        <option value="all">全ての年代</option>
        <option value="1940">1940s</option>
        <option value="1950">1950s</option>
        <option value="1960">1960s</option>
        <option value="1970">1970s</option>
        <option value="1980">1980s</option>
        <option value="1990">1990s</option>
        <option value="2000">2000s</option>
        <option value="2010">2010s</option>
        <option value="2020">2020s</option>
      </select>
      <div class="stat-chip" id="collectionCount"><strong>0</strong>コレクション</div>
    </div>
    <div class="collection-list" id="collectionList"></div>
  </div>

  <!-- Quiz -->
  <div class="section" id="sec-quiz">
    <h2 class="section-title">ファッションクイズ</h2>
    <div class="quiz-area" id="quizArea">
      <div class="quiz-score">
        <div class="quiz-score-num" id="quizScoreNum">0</div>

document.querySelectorAll('.nav-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
    const sec = document.getElementById('sec-'+btn.dataset.section);
    sec.classList.add('active');
    // Re-render bookmarks when navigating to that section
    if(btn.dataset.section==='bookmarks') renderBookmarks();
    // Scroll to top when switching sections
    window.scrollTo({top:0,behavior:'smooth'});
  });
});

function renderTimeline(){
  const track=document.getElementById('timelineTrack');
  track.innerHTML=ERAS.map(e=>`
    <div class="era-card" data-id="${e.id}" onclick="toggleEra(this)">
      <div class="era-years">${e.period}</div>
      <div class="era-title">${e.title}</div>
      <div class="era-desc">${e.desc}</div>
      <div class="era-designers">${e.designers.map(d=>`<span class="era-tag">${d}</span>`).join('')}</div>
      <div class="era-expand-hint">タップして詳細を表示</div>
      <div class="era-detail">${e.detail}</div>
    </div>
  `).join('');
}
function toggleEra(el){el.classList.toggle('expanded')}

  if(search){
    list=list.filter(b=>
      b.name.toLowerCase().includes(search)||
      b.founder.toLowerCase().includes(search)||
      b.iconic.some(i=>i.toLowerCase().includes(search))
    );
  }
  if(sort==='alpha') list.sort((a,b)=>a.name.localeCompare(b.name));
  else if(sort==='year') list.sort((a,b)=>a.year-b.year);
  else if(sort==='country') list.sort((a,b)=>a.country.localeCompare(b.country));

  document.getElementById('brandCount').innerHTML=`<strong>${list.length}</strong>ブランド`;

  grid.innerHTML=list.length ? list.map(b=>{
    const flag = b.country==='France'?'\u{1F1EB}\u{1F1F7}':b.country==='Italy'?'\u{1F1EE}\u{1F1F9}':b.country==='UK'?'\u{1F1EC}\u{1F1E7}':b.country==='Japan'?'\u{1F1EF}\u{1F1F5}':'\u{1F1FA}\u{1F1F8}';
    return `
    <div class="brand-card" data-brand-id="${b.id}">
      <div class="brand-name">${b.name}</div>
      <div class="brand-year">${b.year}</div>
      <div class="brand-founder">${b.founder}</div>
      <div class="brand-country">${flag} ${b.country}</div>
    </div>`;
  }).join('') : '<div class="empty-state">該当するブランドがありません</div>';
}

/* Event delegation for brand cards */
document.getElementById('brandGrid').addEventListener('click',e=>{
  const card = e.target.closest('.brand-card');
  if(card) openBrand(card.dataset.brandId);
});

document.getElementById('brandSort').addEventListener('change',renderBrands);
document.getElementById('brandCountry').addEventListener('change',renderBrands);
document.getElementById('brandSearch').addEventListener('input',renderBrands);

function openBrand(id){
  const b=BRANDS.find(x=>x.id===id);if(!b)return;
  const bm=bookmarks.find(x=>x.type==='brand'&&x.id===id);
  const modal=document.getElementById('brandModal');
  const content=document.getElementById('brandModalContent');
  content.innerHTML=`
    <button class="modal-close" onclick="closeBrandModal()">&times;</button>
    <div class="modal-brand-name">${b.name}</div>
    <div class="modal-brand-sub">${b.year} | ${b.founder} | ${b.country}</div>
    <div class="modal-section">
      <h4>アイコニックアイテム</h4>
      <div>${b.iconic.map(i=>`<span class="modal-tag">${i}</span>`).join('')}</div>
    </div>
    <div class="modal-section">
      <h4>デザイン哲学</h4>
      <p>${b.philosophy}</p>
    </div>
    <div class="modal-section">
      <h4>代表的コレクション</h4>
      <ul>${b.collections.map(c=>`<li>${c}</li>`).join('')}</ul>
    </div>
    <div class="modal-section">
      <h4>文化的影響</h4>
      <p>${b.impact}</p>
    </div>
    <button class="bookmark-btn ${bm?'active':''}" data-bookmark-brand="${b.id}" data-bookmark-name="${b.name}">
      ${bm?'&#9733; ブックマーク済み':'&#9734; ブックマークに追加'}
    </button>
  `;
  /* Bookmark button via event delegation */
  content.querySelector('.bookmark-btn').addEventListener('click',function(){
    toggleBookmark('brand',this.dataset.bookmarkBrand,this.dataset.bookmarkName,this);
  });
  modal.classList.add('show');
  document.body.style.overflow='hidden';
}
function closeBrandModal(){
  document.getElementById('brandModal').classList.remove('show');
  document.body.style.overflow='';
}
document.getElementById('brandModal').addEventListener('click',e=>{
  if(e.target.classList.contains('modal-overlay'))closeBrandModal();
});

/* ================================================================
   COLLECTIONS
   ================================================================ */
function renderCollections(){
  const list=document.getElementById('collectionList');
  const era=document.getElementById('collectionEra').value;
  let filtered=[...COLLECTIONS];
  if(era!=='all'){
    const decade=parseInt(era);
    filtered=filtered.filter(c=>c.year>=decade&&c.year<decade+10);
  }
  filtered.sort((a,b)=>a.year-b.year);

  document.getElementById('collectionCount').innerHTML=`<strong>${filtered.length}</strong>コレクション`;

  list.innerHTML=filtered.length?filtered.map(c=>`
    <div class="collection-card">
      <div class="collection-header">
        <div class="collection-name">${c.name}</div>
        <div class="collection-year">${c.year}</div>
      </div>
      <div class="collection-designer">${c.designer} — ${c.brand}</div>
      <div class="collection-desc">${c.desc}</div>
      <div class="collection-impact">${c.impact}</div>
    </div>
  `).join(''):'<div class="empty-state"><div class="empty-state-icon">&#128194;</div>この年代のコレクションはありません</div>';
}
document.getElementById('collectionEra').addEventListener('change',renderCollections);

/* ================================================================
   QUIZ
   ================================================================ */
const QUIZ_CATS=[
  {id:'brand-founder',label:'ブランド x 創設者'},
  {id:'era-style',label:'時代 x スタイル'},
  {id:'collection-designer',label:'コレクション x デザイナー'},
  {id:'iconic-brand',label:'アイコン x ブランド'},
  {id:'glossary',label:'用語クイズ'}
];

function renderQuizCats(){
  document.getElementById('quizCats').innerHTML=QUIZ_CATS.map(c=>
    `<button class="quiz-cat-btn ${c.id===currentQuizCat?'active':''}" data-quiz-cat="${c.id}">${c.label}</button>`
  ).join('');
}
document.getElementById('quizCats').addEventListener('click',e=>{
  const btn=e.target.closest('.quiz-cat-btn');
  if(btn) setQuizCat(btn.dataset.quizCat);
});

function setQuizCat(cat){
  currentQuizCat=cat;
  renderQuizCats();
  generateQuiz();
}

function generateQuiz(){
  let q,opts,answer,explanation='';
  const qEl=document.getElementById('quizQuestion');
  const oEl=document.getElementById('quizOptions');
  const nEl=document.getElementById('quizNext');
  const exEl=document.getElementById('quizExplanation');
  nEl.classList.remove('show');
  exEl.classList.remove('show');
  exEl.textContent='';

  if(currentQuizCat==='brand-founder'){
    const b=BRANDS[Math.floor(Math.random()*BRANDS.length)];
    q=`「${b.name}」の創設者は？`;
    answer=b.founder;
    explanation=`${b.name}は${b.year}年に${b.founder}が設立。${b.country}のブランド。`;
    opts=shuffle([b.founder,...getRandomItems(BRANDS.filter(x=>x.id!==b.id).map(x=>x.founder),3)]);
  } else if(currentQuizCat==='era-style'){
    const e=ERAS[Math.floor(Math.random()*ERAS.length)];
    q=`${e.period}の時代は何と呼ばれる？`;
    answer=e.title;
    explanation=`${e.period}: ${e.title}（${e.titleEn}）`;
    opts=shuffle([e.title,...getRandomItems(ERAS.filter(x=>x.id!==e.id).map(x=>x.title),3)]);
  } else if(currentQuizCat==='collection-designer'){
    const c=COLLECTIONS[Math.floor(Math.random()*COLLECTIONS.length)];
    q=`「${c.name}」(${c.year})のデザイナーは？`;
    answer=c.designer;
    explanation=`${c.name}は${c.designer}が${c.brand}のために制作。`;
    const others=COLLECTIONS.filter(x=>x.designer!==c.designer).map(x=>x.designer);
    opts=shuffle([c.designer,...getRandomItems([...new Set(others)],3)]);
  } else if(currentQuizCat==='iconic-brand'){
    const b=BRANDS[Math.floor(Math.random()*BRANDS.length)];
    const item=b.iconic[Math.floor(Math.random()*b.iconic.length)];
    q=`「${item}」はどのブランドのアイコン？`;
    answer=b.name;
    explanation=`「${item}」は${b.name}を代表するアイコニックアイテム。`;
    opts=shuffle([b.name,...getRandomItems(BRANDS.filter(x=>x.id!==b.id).map(x=>x.name),3)]);
  } else {
    const g=GLOSSARY[Math.floor(Math.random()*GLOSSARY.length)];
    q=`「${g.term}」の英語名は？`;
    answer=g.en;
    explanation=g.def;
    opts=shuffle([g.en,...getRandomItems(GLOSSARY.filter(x=>x.term!==g.term).map(x=>x.en),3)]);
  }

  currentQuizQ={answer,explanation};
  qEl.textContent=q;

  /* Use data attributes instead of inline onclick with string escaping */
  oEl.innerHTML=opts.map((o,i)=>`<button class="quiz-opt" data-answer-idx="${i}">${o}</button>`).join('');
  oEl.querySelectorAll('.quiz-opt').forEach(btn=>{
    btn.addEventListener('click',function(){
      answerQuiz(this, this.textContent, answer, explanation);
    });
  });
  updateQuizScore();
}

function answerQuiz(el,selected,answer,explanation){
  document.querySelectorAll('.quiz-opt').forEach(o=>{
    o.classList.add('disabled');
    if(o.textContent===answer) o.classList.add('correct');
    else if(o===el&&selected!==answer) o.classList.add('wrong');
  });
  quizTotal++;
  if(selected===answer) quizScore++;
  localStorage.setItem('fashion_quiz_score',quizScore);
  localStorage.setItem('fashion_quiz_total',quizTotal);
  updateQuizScore();
  /* Show explanation */
  if(explanation){
    const exEl=document.getElementById('quizExplanation');
    exEl.textContent=explanation;
    exEl.classList.add('show');
  }
  document.getElementById('quizNext').classList.add('show');
}

function updateQuizScore(){
  document.getElementById('quizScoreNum').textContent=quizScore;
  document.getElementById('quizTotal').textContent=quizTotal;
  const pctEl=document.getElementById('quizPct');
  if(quizTotal>0){
    pctEl.textContent=`正解率 ${Math.round(quizScore/quizTotal*100)}%`;
  } else {
    pctEl.textContent='';
  }
}
document.getElementById('quizNext').addEventListener('click',generateQuiz);

/* Quiz score reset */
document.getElementById('quizReset').addEventListener('click',()=>{
  quizScore=0;quizTotal=0;
  localStorage.setItem('fashion_quiz_score','0');
  localStorage.setItem('fashion_quiz_total','0');
  updateQuizScore();
});

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function getRandomItems(arr,n){return shuffle(arr).slice(0,n)}

/* ================================================================
   GLOSSARY
   ================================================================ */
function renderGlossary(filter=''){
  const list=document.getElementById('glossaryList');
  let items=GLOSSARY;
  if(filter){
    const f=filter.toLowerCase();
    items=items.filter(g=>g.term.toLowerCase().includes(f)||g.en.toLowerCase().includes(f)||g.def.toLowerCase().includes(f));
  }
  document.getElementById('glossaryCount').textContent=`${items.length} 件の用語`;
  list.innerHTML=items.map(g=>`
    <div class="glossary-item" onclick="this.classList.toggle('open')">
      <div class="glossary-term">${g.term}</div>
      <div class="glossary-term-en">${g.en}</div>
      <div class="glossary-def">${g.def}</div>
    </div>
  `).join('');
}
document.getElementById('glossarySearch').addEventListener('input',e=>renderGlossary(e.target.value));

/* ================================================================
   CONNECTIONS
   ================================================================ */
function renderConnections(){
  const container=document.getElementById('connectionsContainer');
  container.innerHTML=CONNECTIONS.map(c=>`
    <div class="connection-group">
      <div class="connection-title">${c.title}</div>
      <div class="connection-flow">
        ${c.flow.map((n,i)=>`<span class="connection-node">${n}</span>${i<c.flow.length-1?'<span class="connection-arrow">\u2192</span>':''}`).join('')}
      </div>
      <div class="connection-desc">${c.desc}</div>
    </div>
  `).join('');
}

/* ================================================================
   BOOKMARKS
   ================================================================ */
function toggleBookmark(type,id,name,btnEl){
  const idx=bookmarks.findIndex(b=>b.type===type&&b.id===id);
  if(idx>-1){
    bookmarks.splice(idx,1);
    if(btnEl){btnEl.classList.remove('active');btnEl.innerHTML='&#9734; ブックマークに追加'}
  } else {
    bookmarks.push({type,id,name});
    if(btnEl){btnEl.classList.add('active');btnEl.innerHTML='&#9733; ブックマーク済み'}
  }
  localStorage.setItem('fashion_bookmarks',JSON.stringify(bookmarks));
}

function renderBookmarks(){
  const list=document.getElementById('bookmarkList');
  if(!bookmarks.length){
    list.innerHTML='<div class="empty-state"><div class="empty-state-icon">&#9734;</div>ブックマークはまだありません<br>ブランド詳細画面から追加できます</div>';
    return;
  }
  list.innerHTML=bookmarks.map((b,i)=>`
    <div class="bookmark-item" data-bm-type="${b.type}" data-bm-id="${b.id}">
      <div class="bookmark-info">
        <div class="bookmark-type">${b.type}</div>
        <div class="bookmark-name">${b.name}</div>
      </div>
      <button class="bookmark-remove" data-bm-idx="${i}">&times;</button>
    </div>
  `).join('');

  /* Event delegation for bookmark actions */
  list.querySelectorAll('.bookmark-item').forEach(item=>{
    item.addEventListener('click',e=>{
      if(e.target.closest('.bookmark-remove')) return;
      const type=item.dataset.bmType;
      const id=item.dataset.bmId;
      if(type==='brand') openBrand(id);
    });
  });
  list.querySelectorAll('.bookmark-remove').forEach(btn=>{
    btn.addEventListener('click',e=>{
      e.stopPropagation();
      removeBookmark(parseInt(btn.dataset.bmIdx));
    });
  });
}
function removeBookmark(idx){
  bookmarks.splice(idx,1);
  localStorage.setItem('fashion_bookmarks',JSON.stringify(bookmarks));
  renderBookmarks();
}

/* ================================================================
   INIT
   ================================================================ */
renderTimeline();
renderBrands();
renderCollections();
renderQuizCats();
updateQuizScore();
renderGlossary();
renderConnections();
renderBookmarks();

/* Service Worker registration for PWA (inline) */
if('serviceWorker' in navigator){
  const swCode=`
    const CACHE='fashion-v2';
    self.addEventListener('install',e=>{self.skipWaiting()});
    self.addEventListener('activate',e=>{
      e.waitUntil(
        caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>clients.claim())
      );
    });
    self.addEventListener('fetch',e=>{
      e.respondWith(
        caches.match(e.request).then(r=>r||fetch(e.request).then(res=>{
          if(res.status===200){
            const clone=res.clone();
            caches.open(CACHE).then(c=>c.put(e.request,clone));
          }
          return res;
        }).catch(()=>new Response('Offline',{status:503})))
      );
    });
  `;
  const swBlob=new Blob([swCode],{type:'application/javascript'});
  const swUrl=URL.createObjectURL(swBlob);
  navigator.serviceWorker.register(swUrl).catch(()=>{});
}
</script>
